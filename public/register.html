<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Regisztráció - GondolatTér</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page auth-page">
    <main class="auth-wrap">
        <section class="auth-card">
            <a href="index.html" class="brand form-brand">
                <span class="brand-symbol">G</span>
                <span>GondolatTér</span>
            </a>

            <h1>Regisztráció</h1>
            
            
            <form id="registerForm">
                <label for="name">Név</label>
                <input type="text" id="name" placeholder="Teljes neved">

                <label for="email">Email cím</label>
                <input type="email" id="email" placeholder="email@example.com">

                <label for="password">Jelszó</label>
                <input type="password" id="password" placeholder="Legalább 6 karakter">

                <p id="message" class="message"></p>
                <button type="submit" class="btn btn-primary full-width">Regisztráció</button>
            </form>
            <p class="form-bottom">Már van fiókod? <a href="login.html">Jelentkezz be!</a></p>
            <script src="js/auth.js"></script>
        
        </section>
    </main>
    <script src="js/ui.js"></script>
</body>
</html>
