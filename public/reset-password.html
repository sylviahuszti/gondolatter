<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Új jelszó - GondolatTér</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page auth-page">
    <main class="auth-wrap">
        <section class="auth-card">
            <a href="index.html" class="brand form-brand">
                <span class="brand-symbol">G</span>
                <span>GondolatTér</span>
            </a>

            <h1>Új jelszó beállítása</h1>
            
            
            <form id="resetForm">
                <label for="password">Új jelszó</label>
                <input type="password" id="password" placeholder="Legalább 6 karakter">

                <label for="passwordAgain">Új jelszó megerősítése</label>
                <input type="password" id="passwordAgain" placeholder="Add meg újra a jelszót">

                <p id="message" class="message"></p>
                <button type="submit" class="btn btn-primary full-width">Jelszó mentése</button>
            </form>
            <div class="hint-box">Válassz egy erős jelszót, amit könnyen megjegyzel, de mások nem találnak ki.</div>
            <script src="js/password.js"></script>
        
        </section>
    </main>
    <script src="js/ui.js"></script>
</body>
</html>
