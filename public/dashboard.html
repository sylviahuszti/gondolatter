<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Saját bejegyzéseim - GondolatTér</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page app-page">
    <main class="app-shell">
        <aside class="side-panel">
            <a href="dashboard.html" class="brand side-brand">
                <span class="brand-symbol">G</span>
                <span>GondolatTér</span>
            </a>

            <a href="entry.html" class="btn btn-primary full-width">+ Új bejegyzés</a>

            <nav class="side-menu">
                <a class="active" href="dashboard.html">Kezdőlap</a>
                <a href="inspiracio.html">Inspiráció</a>
                <a href="profile.html">Profilom</a>
            </nav>

            <button id="logoutBtn" class="logout-link">Kijelentkezés</button>
        </aside>

        <section class="dashboard-area">
            <header class="dashboard-top dashboard-top-clean">
                <div></div>

                <a href="profile.html" class="profile-link">
                    <span id="dashboardAvatar" class="small-avatar">G</span>
                    <span id="userName" class="user-pill"></span>
                </a>
            </header>

            <section class="dashboard-title">
                <div>
                    <h1>Saját bejegyzéseim</h1>
                    <p class="dashboard-subtitle">Itt láthatod, keresheted és szerkesztheted a saját naplóbejegyzéseidet.</p>
                </div>

                <div class="dashboard-tools">
                    <input type="text" id="searchInput" placeholder="Keresés a bejegyzések között...">
                    <select id="sortSelect">
                        <option value="newest">Legújabb elöl</option>
                        <option value="oldest">Legrégebbi elöl</option>
                    </select>
                </div>
            </section>

            <p id="message" class="message"></p>
            <section id="entriesContainer" class="entries-grid"></section>
        </section>
    </main>    <script src="js/ui.js"></script>


    <script src="js/dashboard.js"></script>
</body>
</html>
