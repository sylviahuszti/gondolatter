<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Profilom - GondolatTér</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page app-page">
    <main class="app-shell">
        <aside class="side-panel">
            <a href="dashboard.html" class="brand side-brand">
                <span class="brand-symbol">G</span>
                <span>GondolatTér</span>
            </a>

            <a href="entry.html" class="btn btn-primary full-width">+ Új bejegyzés</a>

            <nav class="side-menu">
                <a href="dashboard.html">Kezdőlap</a>
                <a href="inspiracio.html">Inspiráció</a>
                <a class="active" href="profile.html">Profilom</a>
            </nav>

            <button id="logoutBtn" class="logout-link">Kijelentkezés</button>
        </aside>

        <section class="dashboard-area">
            <header class="dashboard-top dashboard-top-clean">
                <a href="dashboard.html" class="back-link">← Vissza a bejegyzésekhez</a>
            </header>

            <section class="profile-card">
                <div class="profile-left">
                    <div id="profileAvatar" class="profile-avatar">G</div>
                    <label for="avatarInput" class="btn btn-light upload-btn">Profilkép feltöltése</label>
                    <input type="file" id="avatarInput" accept="image/*" hidden>
                </div>

                <form id="profileForm" class="profile-form">
                    <p class="small-label">Profil</p>
                    <h1>Személyes adatok</h1>

                    <label for="profileName">Név</label>
                    <input type="text" id="profileName">

                    <label for="profileEmail">Email cím</label>
                    <input type="email" id="profileEmail" disabled>

                    <label for="createdAt">Regisztráció dátuma</label>
                    <input type="text" id="createdAt" disabled>

                    <div class="profile-stats">
                        <div>
                            <strong id="entryCount">0</strong>
                            <span>bejegyzés</span>
                        </div>
                        <div>
                            <strong id="lastActivity">-</strong>
                            <span>utolsó aktivitás</span>
                        </div>
                    </div>

                    <p id="message" class="message"></p>

                    <button type="submit" class="btn btn-primary">Profil mentése</button>
                </form>
            </section>
        </section>
    </main>    <script src="js/ui.js"></script>


    <script src="js/profile.js"></script>
</body>
</html>
