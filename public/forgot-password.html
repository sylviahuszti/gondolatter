<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Elfelejtett jelszó - GondolatTér</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page auth-page">
    <main class="auth-wrap">
        <section class="auth-card">
            <a href="index.html" class="brand form-brand">
                <span class="brand-symbol">G</span>
                <span>GondolatTér</span>
            </a>

            <h1>Elfelejtett jelszó</h1>
            <p class="auth-subtitle">Add meg az email címed</p>
            
            <form id="forgotForm">
                <label for="email">Add meg az email címed</label>
                <input type="email" id="email" placeholder="email@example.com">

                <p id="message" class="message"></p>
                <div id="resetLinkBox" class="reset-link-box"></div>

                <button type="submit" class="btn btn-primary full-width">Jelszó-visszaállító link küldése</button>
            </form>
            <p class="form-bottom">Emlékszel a jelszavadra? <a href="login.html">Jelentkezz be!</a></p>
            <div class="hint-box">Ha a megadott emailhez fiók tartozik, elkészül egy linket a jelszó-visszaállításhoz.</div>
            <script src="js/password.js"></script>
        
        </section>
    </main>
    <script src="js/ui.js"></script>
</body>
</html>
